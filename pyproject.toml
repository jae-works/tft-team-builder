[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "tft-team-builder"
version = "0.7.0"
description = "Local-first team planning and library tool for Teamfight Tactics."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flet==1.0.1",
    "platformdirs==4.11.15",
    "pydantic==2.13.5",
]

[tool.uv]
required-version = ">=0.12.18,<0.13"

[dependency-groups]
dev = [
    "flet-cli==1.0.1",
    "flet-desktop==1.0.1",
    "flet[test]==1.0.1",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]
web = [
    "flet-web==1.0.1",
]

[project.scripts]
tft-builder-dev = "tft_builder.devtools:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tft_builder"]

[tool.flet]
product = "TFT Team Builder"

[tool.flet.app]
path = "src"
module = "main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-config --strict-markers --import-mode=importlib --cov=tft_builder --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["tft_builder"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "tests_flet", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
