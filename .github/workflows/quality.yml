name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          version: "0.12.19"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Compile project Python
        run: uv run python -m compileall -q src tests tools

      - name: Run tests with coverage
        run: uv run pytest

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Run Ruff formatting check
        run: uv run ruff format --check .

      - name: Enforce project ASCII policy
        run: uv run python tools/check_ascii.py

      - name: Verify project document mirrors
        run: uv run python tools/sync_project_docs.py --check

      - name: Validate bundled sample Set
        run: uv run tft-builder-dev validate-set src/assets/sets/sample_set

      - name: Run persistence smoke test
        run: uv run tft-builder-dev database-smoke .runtime-smoke

      - name: Run Block 3 builder smoke test
        run: uv run tft-builder-dev builder-smoke src/assets/sets/sample_set

      - name: Verify Flet CLI installation
        run: uv run flet --version
