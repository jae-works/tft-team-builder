name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.13"
      - name: Verify lock file
        run: uv lock --check
      - name: Install committed environment
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Compile project Python
        run: uv run python -m compileall -q src tests tests_flet tools
      - name: Run normal tests with full coverage
        run: uv run pytest
      - name: Check ASCII and path policy
        run: uv run python tools/check_ascii.py
      - name: Check mirrored project documents
        run: uv run python tools/sync_project_docs.py --check
      - name: Validate sample Set
        run: uv run tft-builder-dev validate-set src/assets/sets/sample_set
      - name: Exercise persistence smoke flow
        run: uv run tft-builder-dev database-smoke .runtime-smoke
      - name: Exercise Builder smoke flow
        run: uv run tft-builder-dev builder-smoke src/assets/sets/sample_set
      - name: Remove disposable smoke state
        shell: python
        run: |
          from pathlib import Path
          import shutil
          shutil.rmtree(Path(".runtime-smoke"), ignore_errors=True)
      - name: Confirm Flet runtime
        if: runner.os == 'Windows'
        run: uv run flet --version
      - name: Run packaged Flet integration test
        if: runner.os == 'Windows'
        run: uv run pytest tests_flet --no-cov -vv -s
      - name: Verify packaged Windows dependency staging
        if: always() && runner.os == 'Windows'
        run: uv run python tools/check_windows_staging.py build/site-packages
